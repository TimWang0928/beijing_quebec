services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: beijing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d beijing"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ${DOCKERHUB_IMAGE:-timwangdocker/beijing-web:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:12345@db:5432/beijing?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET before running docker compose}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL before running docker compose}
      NEXT_TELEMETRY_DISABLED: "1"
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      # Server-side Clover vars (read at runtime by API routes).
      # NEXT_PUBLIC_CLOVER_PUBLIC_KEY is intentionally NOT here: it is baked
      # into the client bundle at build time via Dockerfile build args.
      CLOVER_PRIVATE_KEY: ${CLOVER_PRIVATE_KEY:?set CLOVER_PRIVATE_KEY}
      CLOVER_CURRENCY: ${CLOVER_CURRENCY:-usd}
      CLOVER_WEBHOOK_AUTH_CODE: ${CLOVER_WEBHOOK_AUTH_CODE:-}
      # Merchant ID is needed server-side too (charge call):
      NEXT_PUBLIC_CLOVER_MERCHANT_ID: ${NEXT_PUBLIC_CLOVER_MERCHANT_ID:?set NEXT_PUBLIC_CLOVER_MERCHANT_ID}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/custom/default-http.conf:ro
      - ./nginx/default-ssl.conf:/etc/nginx/custom/default-ssl.conf:ro
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /etc/letsencrypt/live/beijingquebec.org/fullchain.pem ]; then
          cp /etc/nginx/custom/default-ssl.conf /etc/nginx/conf.d/default.conf;
        else
          cp /etc/nginx/custom/default-http.conf /etc/nginx/conf.d/default.conf;
        fi
        exec nginx -g "daemon off;"

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
  certbot-webroot:
  letsencrypt: